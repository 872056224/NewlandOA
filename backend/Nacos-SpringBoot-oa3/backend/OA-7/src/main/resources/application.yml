spring:
  application:
    name: oa-admin-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        file-extension: yml
        namespace: public
        group: DEFAULT_GROUP
  thymeleaf:
    suffix: .html
    prefix: classpath:/templates/
    cache: false
    check-template-location: true
    mode: HTML
    enabled: true
    encoding: UTF-8
    check-template: true
    servlet:
      content-type: text/html;charset=utf-8
    excluded-view-names:
  datasource:
    name: defaultDataSource
    url: jdbc:mysql://localhost:3306/day?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ljn050825
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 20
      min-idle: 10
      max-active: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    session:
      timeout: 1800
  elasticsearch:
    uris: http://localhost:9201

mybatis:
  mapper-locations: classpath:mappers/*xml
  type-aliases-package: com.oa7.pojo

# Redis
redis:
  host: 127.0.0.1
  port: 6379
  password:
  maxTotal: 1000
  maxIdle: 30
  maxWait: 60
  testOnBorrow: true

# Elasticsearch 配置
elasticsearch:
  host: localhost
  port: 9201

# 日志配置
logging:
  level:
    com.oa7: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

server:
  port: 8082
  servlet:
    context-path: /api/v1/admin

# 员工服务地址（知识库变更后通知重建向量索引）
oa:
  emp-service:
    base-url: http://localhost:8081/api/v1/employee
