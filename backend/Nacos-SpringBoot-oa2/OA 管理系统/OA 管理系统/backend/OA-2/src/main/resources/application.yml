spring:
  application:
    name: oa-emp-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        file-extension: yml
        namespace: public
        group: DEFAULT_GROUP
  thymeleaf:
    suffix: .html
    prefix: classpath:/templates/
    cache: false
    check-template-location: true
    mode: HTML
    enabled: true
    encoding: UTF-8
    check-template: true
    servlet:
      content-type: text/html;charset=utf-8
    excluded-view-names:
  datasource:
    name: defaultDataSource
    url: jdbc:mysql://localhost:3306/day?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ljn050825
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 20
      min-idle: 10
      max-active: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    session:
      timeout: 1800

mybatis:
  mapper-locations: classpath:mappers/*xml
  type-aliases-package: com.oa2.pojo

# Elasticsearch 配置
elasticsearch:
  host: localhost
  port: 9200

# AI 客服配置
# vector-store: 自建向量库持久化路径
# llm: 默认走本地自建向量库检索问答（零外部依赖）；
#      如需大模型生成式回答(RAG)，将 enabled 改为 true 并填入 OpenAI 兼容接口的 api-key
ai:
  vector-store:
    persist-path: ./data/vector-store.json
  llm:
    enabled: false
    base-url: https://api.deepseek.com/v1
    api-key: ""
    model: deepseek-chat
    timeout-ms: 30000

# 日志配置
logging:
  level:
    com.oa2: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

# DeepSeek AI 配置
deepseek:
  api-key: sk-6a795b8a2dc04730b8e42aee016295b7

server:
  port: 8081
  servlet:
    context-path: /api/v1/employee
