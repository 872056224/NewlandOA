spring:
  application:
    name: oa-emp-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        file-extension: yml
        namespace: public
        group: DEFAULT_GROUP
  thymeleaf:
    suffix: .html
    prefix: classpath:/templates/
    cache: false
    check-template-location: true
    mode: HTML
    enabled: true
    encoding: UTF-8
    check-template: true
    servlet:
      content-type: text/html;charset=utf-8
    excluded-view-names:
  datasource:
    name: defaultDataSource
    url: jdbc:mysql://localhost:3306/day?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ljn050825
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 20
      min-idle: 10
      max-active: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    session:
      timeout: 1800

mybatis:
  mapper-locations: classpath:mappers/*xml
  type-aliases-package: com.oa2.pojo
  configuration:
    map-underscore-to-camel-case: false

# Elasticsearch 配置
elasticsearch:
  host: localhost
  port: 9200

# AI 客服配置
# provider: local 时走本地 LM Studio / Ollama（推荐）
# provider: deepseek 时走 DeepSeek API
ai:
  provider: local
  vector-store:
    persist-path: ./data/vector-store.json
  llm:
    enabled: true
    base-url: http://localhost:11434/v1
    api-key: ""
    model: qwen2.5:7b
    timeout-ms: 30000

# 日志配置
logging:
  level:
    com.oa2: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

# DeepSeek API Key（保留备用，当 ai.provider=deepseek 时使用）
deepseek:
  api-key: sk-6a795b8a2dc04730b8e42aee016295b7

server:
  port: 8081
  servlet:
    context-path: /api/v1/employee
